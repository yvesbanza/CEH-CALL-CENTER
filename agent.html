<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH - Espace Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#080808;color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:20px;max-width:500px;width:100%;margin-top:20px}
.btn{padding:14px 20px;border-radius:10px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.btn-green{background:#00FF88;color:#000}
.btn-red{background:#1a1a1a;color:#ff4444;border:1px solid #333}
select{width:100%;padding:12px;background:#0a0a0a;border:1px solid #222;border-radius:10px;color:#fff;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#callScreen{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column;align-items:center;justify-content:center}
#callScreen.active{display:flex}
.logo-agent{width:180px;object-fit:contain;margin:18px 0 8px 0}
</style>
</head>
<body>
<h2 style="margin-top:20px">CEH - Espace Agent</h2>
<p style="color:#666;font-size:13px;margin-top:6px;text-align:center">Les fidèles ne voient JAMAIS votre numéro perso</p>

<!-- LOGO AJOUTÉ ICI -->
<img src="ceh_logo.png" alt="CEH" class="logo-agent">

<div class="card">
<label>Choisissez votre poste</label>
<select id="agentSelect">
<option value="ceh-agent-101">Agent 101 - Yves Banza (Superviseur)</option>
<option value="ceh-agent-102">Agent 102 - +243 896 027 250</option>
<option value="ceh-agent-103">Agent 103 - +243 999 056 257</option>
</select>
<div style="margin-top:16px;display:flex;align-items:center;gap:8px"><span id="dot" class="dot" style="background:#666"></span><span id="status">Hors ligne</span></div>
<button class="btn btn-green" onclick="goOnline()">✅ Se mettre en ligne</button>
<button class="btn btn-red" onclick="goOffline()">Se déconnecter</button>
<p style="color:#444;font-size:11px;margin-top:16px">ID Peer: <span id="peerId">-</span><br>Gardez cette page ouverte pour recevoir les appels.</p>
</div>

<div id="callScreen">
<h2>📞 Appel entrant</h2>
<p id="callerInfo" style="color:#888;margin-top:10px">Fidèle CEH</p>
<audio id="remoteAudio" autoplay></audio>
<div style="display:flex;gap:20px;margin-top:40px">
<button class="btn btn-green" style="width:80px;height:80px;border-radius:50%;font-size:28px" onclick="answerCall()">✓</button>
<button class="btn btn-red" style="width:80px;height:80px;border-radius:50%;font-size:24px" onclick="declineCall()">✕</button>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
let peer=null,incomingCall=null,localStream=null;
async function goOnline(){
  const id=document.getElementById('agentSelect').value;
  peer=new Peer(id);
  peer.on('open',i=>{document.getElementById('peerId').textContent=i;document.getElementById('status').textContent="En ligne - En attente d'appels";document.getElementById('dot').style.background="#00FF88";});
  peer.on('call',async call=>{incomingCall=call;document.getElementById('callScreen').classList.add('active');document.getElementById('callerInfo').textContent="Fidèle - "+call.peer;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){alert("Autorisez micro");}});
}
function goOffline(){if(peer)peer.destroy();document.getElementById('status').textContent="Hors ligne";document.getElementById('dot').style.background="#666";}
async function answerCall(){incomingCall.answer(localStream);incomingCall.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s;document.getElementById('callerInfo').textContent="En communication...";});}
function declineCall(){if(incomingCall)incomingCall.close();document.getElementById('callScreen').classList.remove('active');}
</script>
</body>
</html>
