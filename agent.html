<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEH - Espace Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#080808;color:#fff;padding:12px;display:flex;flex-direction:column;align-items:center}
h2{font-size:20px;margin-top:8px}
.sub{color:#666;font-size:12px;margin-top:4px;text-align:center}
.logo-mid{width:48vw;max-width:180px;height:auto;object-fit:contain;margin:10px 0}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:16px;max-width:500px;width:100%;margin-top:8px}
.btn{padding:12px 20px;border-radius:10px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:10px;font-size:14px}
.btn-green{background:#00FF88;color:#000}
.btn-red{background:#1a1a1a;color:#ff4444;border:1px solid #333}
select{width:100%;padding:10px;background:#0a0a0a;border:1px solid #222;border-radius:10px;color:#fff;margin-top:6px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#callScreen{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column;align-items:center;justify-content:center}
#callScreen.active{display:flex}
</style>
</head>
<body>
<h2>CEH - Espace Agent</h2>
<p class="sub">Les fidèles ne voient JAMAIS votre numéro perso</p>
<img src="ceh_logo.png?v=102" class="logo-mid" alt="CEH">

<div class="card">
<label style="font-size:14px">Choisissez votre poste</label>
<select id="agentSelect">
<option value="ceh-agent-101">Agent 101 - Yves Banza (Superviseur)</option>
<option value="ceh-agent-102">Agent 102 - +243 896 027 250</option>
<option value="ceh-agent-103">Agent 103 - +243 999 056 257</option>
</select>
<div style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14px"><span id="dot" class="dot" style="background:#666"></span><span id="status">Hors ligne - Cliquez sur Se mettre en ligne</span></div>
<button class="btn btn-green" id="onlineBtn">✅ Se mettre en ligne</button>
<button class="btn btn-red" id="offlineBtn">Se déconnecter</button>
<p style="color:#444;font-size:10px;margin-top:12px">ID Peer: <span id="peerId">-</span><br>Gardez cette page ouverte pour recevoir les appels.</p>
<p id="debug" style="color:#ffaa00;font-size:10px;margin-top:8px"></p>
</div>

<div id="callScreen">
<h2>📞 Appel entrant</h2>
<p id="callerInfo" style="color:#888;margin-top:10px">Fidèle CEH</p>
<audio id="remoteAudio" autoplay></audio>
<div style="display:flex;gap:20px;margin-top:40px">
<button class="btn btn-green" style="width:70px;height:70px;border-radius:50%;font-size:24px" id="answerBtn">✓</button>
<button class="btn btn-red" style="width:70px;height:70px;border-radius:50%;font-size:20px" id="declineBtn">✕</button>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
let peer=null,incomingCall=null,localStream=null;
const statusEl=document.getElementById('status');
const dotEl=document.getElementById('dot');
const peerIdEl=document.getElementById('peerId');
const debugEl=document.getElementById('debug');

function log(msg){debugEl.textContent=msg; console.log(msg);}

document.getElementById('onlineBtn').addEventListener('click', goOnline);
document.getElementById('offlineBtn').addEventListener('click', goOffline);
document.getElementById('answerBtn').addEventListener('click', answerCall);
document.getElementById('declineBtn').addEventListener('click', declineCall);

async function goOnline(){
  const id=document.getElementById('agentSelect').value;
  statusEl.textContent="Connexion en cours...";
  log("Tentative connexion: "+id);
  if(peer){try{peer.destroy();}catch(e){}}
  // Nouvelle config plus stable
  peer=new Peer(id, {debug:1});
  peer.on('open', i=>{
    peerIdEl.textContent=i;
    statusEl.textContent="✅ EN LIGNE - En attente d'appels";
    dotEl.style.background="#00FF88";
    log("Connecté avec ID: "+i);
  });
  peer.on('error', err=>{
    statusEl.textContent="Erreur: "+err.type;
    log("Erreur Peer: "+err.type+" - "+err.message);
    if(err.type==='unavailable-id'){
      alert("Cet Agent est déjà en ligne ailleurs. Déconnectez l'autre appareil d'abord.");
      statusEl.textContent="Hors ligne - ID déjà utilisé";
      dotEl.style.background="#ff4444";
    }
  });
  peer.on('call', async call=>{
    incomingCall=call;
    document.getElementById('callScreen').classList.add('active');
    document.getElementById('callerInfo').textContent="Fidèle: "+call.peer;
    try{
      localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      alert("Autorisez le micro pour répondre");
      log("Micro refusé");
    }
  });
}

function goOffline(){
  if(peer){peer.destroy(); peer=null;}
  statusEl.textContent="Hors ligne";
  dotEl.style.background="#666";
  peerIdEl.textContent="-";
  log("Déconnecté");
}

async function answerCall(){
  if(!incomingCall) return;
  incomingCall.answer(localStream);
  incomingCall.on('stream', s=>{
    document.getElementById('remoteAudio').srcObject=s;
    document.getElementById('callerInfo').textContent="En communication...";
    statusEl.textContent="En appel";
  });
  incomingCall.on('close', ()=>{document.getElementById('callScreen').classList.remove('active'); statusEl.textContent="✅ EN LIGNE - En attente d'appels";});
}
function declineCall(){
  if(incomingCall)incomingCall.close();
  document.getElementById('callScreen').classList.remove('active');
  log("Appel refusé");
}
</script>
</body>
</html>
