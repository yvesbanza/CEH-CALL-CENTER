<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CEH CALL-CENTER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo-img{width:85vw;max-width:380px;max-height:60vh;object-fit:contain}
.btn{margin-top:35px;background:#fff;color:#000;border:none;padding:18px 55px;border-radius:14px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 10px 30px rgba(255,255,255,.15)}
.num{margin-top:20px;color:#888;font-size:14px;letter-spacing:1px}
.num b{color:#aaa}
.status{margin-top:10px;color:#00FF88;font-size:13px;min-height:18px}
.call-ui{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column;align-items:center;justify-content:center}
.call-ui.active{display:flex}
.hangup{margin-top:40px;background:#ff2d2d;color:#fff;border:none;width:70px;height:70px;border-radius:50%;font-size:28px;cursor:pointer}
</style>
</head>
<body>

<img src="ceh_logo.png" alt="CEH CALL-CENTER" class="logo-img">

<button id="btn" class="btn" onclick="startCall()">NOUS CONTACTER</button>
<div class="num">+243 838 779 476</div>
<div id="status" class="status"></div>

<div id="callUI" class="call-ui">
<h2 id="state">Connexion...</h2>
<p id="info" style="color:#666;margin-top:8px">Recherche d'un agent disponible</p>
<audio id="audio" autoplay></audio>
<button class="hangup" onclick="endCall()">✕</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const AGENTS=["ceh-agent-101","ceh-agent-102","ceh-agent-103"];
let peer,call,stream;
let p=new Peer("fidele-"+Math.random().toString(36).substr(2,5));
p.on('open',()=>{document.getElementById('status').textContent="Prêt à appeler"});
async function startCall(){
  document.getElementById('callUI').classList.add('active');
  document.getElementById('state').textContent="Connexion au standard...";
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){alert("Autorisez le micro");endCall();return;}
  let i=parseInt(localStorage.getItem('ceh_rr')||'0'); let t=AGENTS[i%AGENTS.length]; i++; localStorage.setItem('ceh_rr',i);
  document.getElementById('info').textContent="Connexion à un agent...";
  call=p.call(t,stream);
  if(!call){document.getElementById('info').textContent="Aucun agent en ligne"; setTimeout(endCall,2500); return;}
  call.on('stream',s=>{document.getElementById('state').textContent="En communication";document.getElementById('info').textContent="Connecté à CEH CALL-CENTER";document.getElementById('audio').srcObject=s;});
  call.on('close',endCall);
}
function endCall(){if(call)call.close();if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('callUI').classList.remove('active');document.getElementById('status').textContent="Appel terminé";}
</script>
</body>
</html>
