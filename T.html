<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEH CALL-CENTER V5</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;text-align:center;margin:0;padding:0}
.card{background:#151515;border-radius:12px;padding:12px;margin:10px;text-align:left;border:1px solid #222}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px}
.btn-white{background:#fff;color:#000}.btn-dark{background:#222;color:#fff}.btn-green{background:#0a5;color:#fff}
input,select{width:100%;padding:12px;border-radius:8px;border:none;margin-top:6px;background:#222;color:#fff;box-sizing:border-box}
.hidden{display:none!important}
.back{color:#aaa;padding:10px;display:block;text-align:left}
.eye{position:absolute;right:10px;top:32px}
</style>
</head>
<body>
<div id="view-landing">
<div style="margin-top:20px"><h1>CEH CALL-CENTER V5</h1><p style="color:#0f8">Av. Suala n°6, Bandalungwa</p></div>
<button class="btn btn-white" onclick="show('view-fidele')">1. FIDÈLE</button>
<button class="btn btn-dark" onclick="show('view-agent-login')">2. AGENT CALL-CENTER</button>
<button class="btn btn-dark" onclick="show('view-superviseur-login')">3. SUPERVISEUR</button>
<button class="btn btn-dark" style="font-size:10px;background:#111" onclick="resetTo1234()">⚠️ Réinitialiser à 1234 si bug</button>
</div>

<div id="view-fidele" class="hidden"><span class="back" onclick="show('view-landing')">← Retour</span>
<h3>Espace Fidèle</h3>
<div class="card" id="cardInscriptionFidele">
<h4>Inscription (une fois)</h4>
<input id="fideleNameInput" placeholder="Votre nom complet">
<input id="fideleAdresseInput" placeholder="Adresse complète">
<input id="fidelePhoneInput" placeholder="Numéro de téléphone ex: +243...">
<button class="btn btn-dark" onclick="registerFideleLocal()">S'inscrire</button>
</div>
<p id="msgInscriptionObligatoire" style="color:#ff5555;font-weight:bold;display:none">⚠️ Veuillez vous inscrire avant de contacter le service CALL-CENTER</p>
<div class="card"><button class="btn btn-green" id="btnCallFidele" onclick="callFidele()">📞 NOUS CONTACTER</button><p id="fideleStatus"></p></div>
</div>

<div id="view-agent-login" class="hidden"><span class="back" onclick="show('view-landing')">← Retour</span><h3>Agent Login</h3>
<div class="card"><select id="agentSelectLogin"></select><div style="position:relative"><input id="agentPin" type="password" placeholder="Code PIN (1234)"><span class="eye" onclick="toggleEye('agentPin',this)"></span></div><button class="btn btn-white" onclick="loginAgent()">Déverrouiller</button><p id="agentLoginMsg" style="color:#f55"></p></div></div>

<div id="view-agent" class="hidden"><span class="back" onclick="show('view-landing')">← Déconnexion</span><h3>Agent: <span id="agentWelcome"></span></h3><p id="agentState">Hors ligne</p><button class="btn btn-green" onclick="goOnline()">Passer en ligne</button><button class="btn btn-dark" onclick="goOffline()">Hors ligne</button><div id="listFidelesAgent"></div></div>

<div id="view-sup-login" class="hidden"><span class="back" onclick="show('view-landing')">← Retour</span><h3>Superviseur</h3><div class="card"><div style="position:relative"><input id="supPin" type="password" placeholder="PIN Superviseur"><span class="eye" onclick="toggleEye('supPin',this)"></span></div><button class="btn btn-white" onclick="loginSup()">Entrer</button><p id="supLoginMsg" style="color:#f55"></p></div></div>

<div id="view-superviseur" class="hidden"><span class="back" onclick="show('view-landing')">← Déconnexion</span><h3>Superviseur</h3><div id="supContent"></div></div>
<script>
const LS_AGENTS='ceh_agents_v2', LS_AGENT_PINS='ceh_agent_pins', LS_SUP_PIN='ceh_sup_pin', LS_CALL='ceh_current_call', LS_ONLINE='ceh_online_agents', LS_SESSION='ceh_session', LS_FIDELES='ceh_fideles_list', LS_NOTIFS='ceh_notifs';
let agents=JSON.parse(localStorage.getItem(LS_AGENTS) || '[{"name":"Yves Banza","phone":"+243838779476","code":"101"},{"name":"Agent 102","phone":"+243000000000","code":"102"}]');
let agentPins=JSON.parse(localStorage.getItem(LS_AGENT_PINS) || 'null');
if(!agentPins){ agentPins={}; agents.forEach(a=>agentPins[a.code]="1234"); localStorage.setItem(LS_AGENT_PINS, JSON.stringify(agentPins)); }
let currentAgent=null;
const EYE_SLASH=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8a8a8a" stroke-width="1.8"><path d="M9.88 4.12A10.94 10.94 0 0 1 12 4c7 0 10 8 10 8a17.3 17.3 0 0 1-3.33 4.85"/><path d="M10.73 10.73a3 3 0 0 0 4.24 4.24"/><path d="M2 2l20 20"/></svg>`;
const EYE_OPEN=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8a8a8a" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
function initEyes(){ document.querySelectorAll('.eye').forEach(e=>e.innerHTML=EYE_SLASH); }
function toggleEye(id,el){ const i=document.getElementById(id); if(i.type==='password'){ i.type='text'; el.innerHTML=EYE_OPEN; } else { i.type='password'; el.innerHTML=EYE_SLASH; } }
function resetTo1234(){ agentPins={}; agents.forEach(a=>agentPins[a.code]="1234"); localStorage.setItem(LS_AGENT_PINS, JSON.stringify(agentPins)); localStorage.setItem(LS_AGENTS, JSON.stringify(agents)); alert('✅ Tous les codes remis à 1234'); location.reload(); }
function show(id){ document.querySelectorAll('[id^=view-]').forEach(d=>d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if(id.includes('agent')) renderSelects(); if(id==='view-superviseur') renderAgentsList(); if(id==='view-agent') renderFidelesAgent(); if(id==='view-fidele'){ const myId=localStorage.getItem('ceh_my_fidele_id'); let card=document.getElementById('cardInscriptionFidele'); if(myId){ if(card) card.classList.add('hidden'); let msg=document.getElementById('msgInscriptionObligatoire'); if(msg) msg.style.display='none'; } else { if(card) card.classList.remove('hidden'); } } }
function renderSelects(){ const s=document.getElementById('agentSelectLogin'); if(!s) return; s.innerHTML=''; if(agents.length===0){ agents=[{name:"Yves Banza",phone:"+243838779476",code:"101"}]; localStorage.setItem(LS_AGENTS,JSON.stringify(agents)); } agents.forEach(a=>{ let o=document.createElement('option'); o.value=a.code; o.textContent=`Agent ${a.code} - ${a.name}`; s.appendChild(o); }); }
function loginAgent(){ const sel=document.getElementById('agentSelectLogin'); const code=sel?sel.value:''; const pin=document.getElementById('agentPin').value.trim(); if(!code){ document.getElementById('agentLoginMsg').textContent='Choisis un agent'; return; } if(agentPins[code]===pin){ currentAgent=agents.find(a=>a.code===code); localStorage.setItem(LS_SESSION, code); document.getElementById('agentWelcome').textContent=currentAgent.name; show('view-agent'); goOnline(); } else { document.getElementById('agentLoginMsg').textContent='Incorrect - code attendu: '+(agentPins[code]||'1234'); } }
function loginSup(){ const pin=document.getElementById('supPin').value.trim(); const saved=localStorage.getItem(LS_SUP_PIN)||'2025'; if(pin===saved||pin==='2025'){ show('view-superviseur'); } else { document.getElementById('supLoginMsg').textContent='PIN Incorrect'; } }
function registerFideleLocal(){ const n=document.getElementById('fideleNameInput').value.trim(), adr=document.getElementById('fideleAdresseInput').value.trim(), tel=document.getElementById('fidelePhoneInput').value.trim(); if(!n||!adr||!tel) return alert('Remplis les 3 cases'); let list=JSON.parse(localStorage.getItem(LS_FIDELES)||'[]'); if(list.find(f=>f.phone===tel)) return alert('Numéro déjà inscrit'); let id=tel.replace(/[^0-9]/g,'')+'_'+Date.now(); list.unshift({id:id,name:n,adresse:adr,phone:tel,registered:Date.now()}); localStorage.setItem(LS_FIDELES, JSON.stringify(list)); localStorage.setItem('ceh_my_fidele_id', id); localStorage.setItem('ceh_my_fidele_name', n); localStorage.setItem('ceh_my_fidele_phone', tel); alert('✅ Inscrit: '+n); document.getElementById('cardInscriptionFidele').classList.add('hidden'); let m=document.getElementById('msgInscriptionObligatoire'); if(m) m.style.display='none'; renderFidelesAgent(); }
function renderFidelesAgent(){ const list=JSON.parse(localStorage.getItem(LS_FIDELES)||'[]'); const div=document.getElementById('listFidelesAgent'); if(!div) return; div.innerHTML='<button class="btn btn-white" style="padding:10px;font-size:13px" onclick="showBdFideles()">📖 Ouvrir BD Fidèles ('+list.length+')</button>'; }
function showBdFideles(){ let list=JSON.parse(localStorage.getItem(LS_FIDELES)||'[]'); let html='<div id="bdFidelesModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:2000;overflow:auto;padding:15px"><span style="color:#aaa" onclick="document.getElementById(\'bdFidelesModal\').remove()">← Fermer</span><h3>📖 BD Fidèles - '+list.length+' inscrits</h3><input id="searchFidele" placeholder="Rechercher" oninput="filterBdFideles()" style="margin-bottom:10px"><div id="bdContent">'; list.forEach(f=>{ html+=`<div class="card" style="margin-top:8px"><b>${f.name}</b><br><small>📍 ${f.adresse||''}</small><br><small>📞 ${f.phone}</small></div>`; }); html+='</div></div>'; document.body.insertAdjacentHTML('beforeend',html); }
function filterBdFideles(){ let q=document.getElementById('searchFidele').value.toLowerCase(); let list=JSON.parse(localStorage.getItem(LS_FIDELES)||'[]'); let filtered=list.filter(f=>(f.name+f.adresse+f.phone).toLowerCase().includes(q)); let cont=document.getElementById('bdContent'); cont.innerHTML=''; filtered.forEach(f=>{ cont.innerHTML+=`<div class="card" style="margin-top:8px"><b>${f.name}</b><br><small>📍 ${f.adresse||''}</small><br><small>📞 ${f.phone}</small></div>`; }); }
function goOnline(){ let online=JSON.parse(localStorage.getItem(LS_ONLINE)||'[]'); if(currentAgent &&!online.includes(currentAgent.code)){ online.push(currentAgent.code); localStorage.setItem(LS_ONLINE, JSON.stringify(online)); } document.getElementById('agentState').textContent='En ligne'; }
function goOffline(){ let online=JSON.parse(localStorage.getItem(LS_ONLINE)||'[]'); if(currentAgent){ online=online.filter(c=>c!==currentAgent.code); localStorage.setItem(LS_ONLINE, JSON.stringify(online)); } document.getElementById('agentState').textContent='Hors ligne'; }
function renderAgentsList(){ const d=document.getElementById('supContent'); if(!d) return; let list=JSON.parse(localStorage.getItem(LS_FIDELES)||'[]'); d.innerHTML='<button class="btn btn-white" style="padding:12px;margin-bottom:10px" onclick="showBdFideles()">📖 BD Fidèles - Voir tous les inscrits ('+list.length+')</button><h4>Agents: '+agents.length+'</h4>'; agents.forEach(a=>{ d.innerHTML+='<div class="card">'+a.name+' - '+a.code+' - PIN:'+(agentPins[a.code]||'1234')+'</div>'; }); }
async function callFidele(){ const myId=localStorage.getItem('ceh_my_fidele_id'); if(!myId){ document.getElementById('msgInscriptionObligatoire').style.display='block'; document.getElementById('msgInscriptionObligatoire').scrollIntoView(); if(navigator.vibrate) navigator.vibrate([200,100,200]); return; } document.getElementById('msgInscriptionObligatoire').style.display='none'; document.getElementById('fideleStatus').textContent='Recherche agent...'; let online=JSON.parse(localStorage.getItem(LS_ONLINE)||'[]'); if(online.length===0){ document.getElementById('fideleStatus').textContent='Aucun agent en ligne'; return; } let call={id:Date.now(),fideleId:myId,fideleName:localStorage.getItem('ceh_my_fidele_name'),fidelePhone:localStorage.getItem('ceh_my_fidele_phone'),agentCode:online[0],time:Date.now()}; localStorage.setItem(LS_CALL, JSON.stringify(call)); document.getElementById('fideleStatus').textContent='Appel en cours vers agent '+online[0]; }
window.onload=()=>{ initEyes(); renderSelects(); show('view-landing'); };
</script>
</body>
</html>
